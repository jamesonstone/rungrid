version: "0.5"
name: example-workspace-k7m4q2
log_level: info
is_strict: true
ordered_shutdown: true
processes:
  database:
    command: ./wrappers/database
    working_dir: .
    log_location: ./logs/database.log
    log_configuration:
      rotation:
        max_size_mb: 10
        max_age_days: 7
        max_backups: 1
        compress: true
    is_dotenv_disabled: true
    availability:
      restart: no
      backoff_seconds: 1
      max_restarts: 0
    readiness_probe:
      exec:
        command: ./wrappers/database-health
        working_dir: .
      initial_delay_seconds: 0
      period_seconds: 2
      timeout_seconds: 3
      failure_threshold: 30
  api:
    command: ./wrappers/api
    working_dir: .
    log_location: ./logs/api.log
    log_configuration:
      rotation:
        max_size_mb: 10
        max_age_days: 7
        max_backups: 1
        compress: true
    is_dotenv_disabled: true
    disabled: true
    depends_on:
      database:
        condition: process_healthy
    availability:
      restart: no
      backoff_seconds: 1
      max_restarts: 0
  web:
    command: ./wrappers/web
    working_dir: .
    log_location: ./logs/web.log
    log_configuration:
      rotation:
        max_size_mb: 10
        max_age_days: 7
        max_backups: 1
        compress: true
    is_dotenv_disabled: true
    disabled: true
    availability:
      restart: no
      backoff_seconds: 1
      max_restarts: 0
  rungrid-resource-guard:
    command: ./wrappers/rungrid-resource-guard
    working_dir: .
    log_location: ./logs/rungrid-resource-guard.log
    log_configuration:
      rotation:
        max_size_mb: 10
        max_age_days: 7
        max_backups: 1
        compress: true
    is_dotenv_disabled: true
    namespace: rungrid-internal
    availability:
      restart: on_failure
      backoff_seconds: 1
      max_restarts: 3
  rungrid-maintenance-sync:
    command: ./wrappers/rungrid-maintenance-sync
    working_dir: .
    log_location: ./logs/rungrid-maintenance-sync.log
    log_configuration:
      rotation:
        max_size_mb: 10
        max_age_days: 7
        max_backups: 1
        compress: true
    is_dotenv_disabled: true
    disabled: true
    namespace: maintenance
    availability:
      restart: no
      backoff_seconds: 0
      max_restarts: 0
  rungrid-maintenance-worktrees-prune:
    command: ./wrappers/rungrid-maintenance-worktrees-prune
    working_dir: .
    log_location: ./logs/rungrid-maintenance-worktrees-prune.log
    log_configuration:
      rotation:
        max_size_mb: 10
        max_age_days: 7
        max_backups: 1
        compress: true
    is_dotenv_disabled: true
    disabled: true
    namespace: maintenance
    availability:
      restart: no
      backoff_seconds: 0
      max_restarts: 0
